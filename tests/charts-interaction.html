<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图表提示浮层回归检查</title>
<link rel="stylesheet" href="../styles.css">
<main style="max-width:800px;margin:24px auto;padding:0 16px">
  <h1>图表提示浮层回归检查</h1>
  <p>仅使用合成数据，模拟触摸后没有 blur / pointerleave 事件的情况。</p>
  <button class="btn primary" id="run" type="button">运行检查</button>
  <button class="btn" id="preview" type="button">预览首次触屏点按</button>
  <button class="btn" id="history" type="button">预览全部账单历史</button>
  <p id="result" role="status">尚未运行</p>
  <ol id="results"></ol>
  <div id="fixture"></div>
  <button class="btn" id="outside" type="button">图表外空白区域</button>
</main>
<script type="module">
import { columnChart, lineChart } from '../src/ui/charts.js';
import { render as renderBills } from '../src/views/bills.js';
import { providerHistory } from '../src/views/providerHistory.js';
import { LANGS, setLang, t } from '../src/i18n.js';

const fixture = document.getElementById('fixture');
const outside = document.getElementById('outside');
const result = document.getElementById('result');
const results = document.getElementById('results');
const options = {
  title: '合成账单费用', labels: ['2026/01', '2026/02'],
  series: [{ name: '电力输配费', color: '#2a78d6', values: [100, 120] },
    { name: '发电费', color: '#eda100', values: [20, 30] }],
  stacked: true, format: n => '$' + n.toFixed(2), tickFormat: n => '$' + n,
  tableLabel: '表格', totalLabel: '合计', height: 200, billHelp: true,
};
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const visibleTip = () => document.querySelector('.viz-tip:not([hidden])');
const mount = (kind = 'bar', extra = {}) => {
  const chart = document.createElement('section'); chart.className = 'card';
  fixture.replaceChildren(chart);
  (kind === 'bar' ? columnChart : lineChart)(chart, { ...options, ...extra });
  return chart;
};
const showTouch = chart => {
  const hit = chart.querySelector('.viz-hit');
  const rect = hit.getBoundingClientRect();
  if (chart.querySelector('.viz-col')) tap(chart);
  else hit.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerType: 'touch', clientX: rect.left + rect.width / 2, clientY: rect.top + 40 }));
  assert(visibleTip(), '触摸提示未显示');
  return hit;
};
const closed = () => assert(!visibleTip(), '提示浮层仍停留在屏幕上');
const nextFrame = () => new Promise(resolve => requestAnimationFrame(resolve));
const withHoverMouse = (available, check) => {
  const original = window.matchMedia;
  window.matchMedia = query => query === '(hover: hover) and (pointer: fine)' ? { matches: available } : original.call(window, query);
  try { return check(); } finally { window.matchMedia = original; }
};
const tap = (chart, index = 0, legacyClick = false) => {
  const hit = chart.querySelectorAll('.viz-hit')[index], rect = hit.getBoundingClientRect();
  const event = { bubbles: true, pointerType: 'touch', pointerId: 1, isPrimary: true, clientX: rect.left + rect.width / 2, clientY: rect.top + 40, detail: 1 };
  hit.dispatchEvent(new PointerEvent('pointerdown', event)); hit.focus();
  hit.dispatchEvent(new PointerEvent('pointerup', event));
  hit.dispatchEvent(new PointerEvent('pointerleave', { ...event, bubbles: false }));
  hit.dispatchEvent(legacyClick ? new MouseEvent('click', event) : new PointerEvent('click', event));
};
const billHistory = (utility = 'electricity', metric = 'total') => {
  const water = utility === 'water', count = water ? 15 : 26;
  const bills = Array.from({ length: count }, (_, i) => {
    const start = new Date(Date.UTC(2024, i * (water ? 2 : 1), 1)).toISOString().slice(0, 10);
    const end = new Date(Date.UTC(2024, (i + 1) * (water ? 2 : 1), 1)).toISOString().slice(0, 10);
    return { id: 'synthetic-' + i, providerId: 'synthetic', statementDate: end, periodStart: start, periodEnd: end,
      total: 120 + i, items: [{ key: water ? 'water' : 'electric_delivery', amount: 120 + i }],
      usage: [{ key: utility, amount: 200 + i }] };
  });
  const root = document.createElement('div'); fixture.replaceChildren(root);
  const ctx = { D: { bills: [...bills].reverse(), providers: { synthetic: { name: '合成账单', category: water ? 'water' : 'energy' } } },
    L: { prefs: { utility, utilityMetric: metric, utilityRange: '12' } }, S: { data: { servicePeriods: {} } },
    nav: id => { fixture.textContent = id; }, setPref: (key, value) => { ctx.L.prefs[key] = value; },
    render: () => { root.replaceChildren(); renderBills(root, ctx); }, openAdd: () => {} };
  renderBills(root, ctx);
  return { root, count, ctx };
};
const cases = [
  ['全部账单可横向浏览，每屏仍显示 12 张，不受旧的 12 张偏好限制', async () => {
    for (const [utility, metric] of [['electricity', 'total'], ['water', 'total'], ['electricity', 'daily']]) {
      const { root, count } = billHistory(utility, metric);
      await nextFrame(); await nextFrame();
      for (const plot of root.querySelectorAll('.viz-scroll')) {
        assert(plot.querySelectorAll('.viz-hit').length === count, '早期账单仍被截掉');
        assert(plot.scrollWidth > plot.clientWidth, '图表没有可滚动的历史');
        assert(plot.scrollLeft > 0, '没有从最新账单开始显示');
        const band = +plot.querySelector('.viz-hit').getAttribute('width');
        assert(Math.abs(band * 12 + 64 - plot.clientWidth) < 1, '每屏显示数量不是 12 张');
        plot.scrollLeft = 0;
        await nextFrame();
        const first = plot.querySelector('.viz-hit').getBoundingClientRect(), viewport = plot.getBoundingClientRect();
        assert(first.left >= viewport.left && first.right <= viewport.right, '最早账单无法滚动到可见区域');
        assert(plot.querySelector('.viz-y-axis').getAttribute('transform') === 'translate(0,0)', '纵轴未随滚动保持可见');
      }
    }
  }],
  ['图表只显示当前设备的操作说明，数据解释放在折叠说明中', () => {
    try {
      for (const lang of LANGS) {
        setLang(lang);
        const { root } = billHistory();
        const mouse = matchMedia('(hover: hover) and (pointer: fine)').matches;
        const visible = el => getComputedStyle(el).display !== 'none';
        for (const help of root.querySelectorAll('.viz-help')) {
          assert([...help.querySelectorAll('.viz-mouse-help')].every(el => visible(el) === mouse), '鼠标说明显示条件不正确');
          assert([...help.querySelectorAll('.viz-touch-help')].every(el => visible(el) !== mouse), '触控说明显示条件不正确');
        }
        assert(root.querySelectorAll('.viz-help').length === 2, '图表缺少操作说明');
        const dataNote = t('u.dataNote', { mode: t('u.metric.daily') });
        assert(root.querySelector('.field-guide').textContent.includes(dataNote), '数据说明未放在折叠区');
        assert(!t('u.chartNote').includes(dataNote), '操作指南仍混入数据说明');
      }
    } finally { setLang('zh-Hans'); }
  }],
  ['账单详情图沿用统一说明，切换到表格时隐藏图表操作提示', () => {
    const { ctx, count } = billHistory();
    const card = providerHistory(ctx, 'synthetic'); fixture.replaceChildren(card);
    const help = card.querySelector('.viz-help');
    assert(help && help.textContent.includes(t('viz.touchScroll')), '详情图缺少历史滚动说明');
    assert(card.querySelectorAll('.viz-hit').length === count, '详情图未显示全部账单');
    card.querySelectorAll('.viz-toggle')[1].click();
    assert(help.hidden, '表格模式仍显示图表操作提示');
    card.querySelectorAll('.viz-toggle')[1].click();
    assert(!help.hidden, '返回图表后操作提示未恢复');
  }],
  ['三种语言的浮层均使用新版提示，短历史不提示查看更多', () => {
    try {
      for (const lang of LANGS) {
        setLang(lang);
        const chart = mount('bar', { onSelect: () => {}, visibleCount: 12 });
        tap(chart);
        assert(visibleTip()?.querySelector('.viz-open')?.textContent === t('viz.openBill'), '查看账单入口未显示');
        assert(!chart.querySelector('.viz-help').textContent.includes(t('viz.touchScroll')), '短历史不应提示存在更多账单');
      }
    } finally { setLang('zh-Hans'); }
  }],
  ['触屏首次点按保留提示，不立即打开账单', async () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; fixture.replaceChildren(); } });
    tap(chart); await nextFrame(); await nextFrame();
    assert(selected === null, '首次点按就打开了账单');
    assert(visibleTip()?.textContent.includes('$120.00'), '手指离开后提示未保留');
  }],
  ['重复点按柱子只切换预览，点击浮层入口才打开对应账单', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; fixture.replaceChildren(); } });
    tap(chart, 0); tap(chart, 1);
    assert(selected === null && visibleTip()?.textContent.includes('2026/02'), '切换柱子时意外打开账单');
    tap(chart, 1); assert(selected === null, '重复点按柱子仍会打开账单');
    const open = visibleTip().querySelector('.viz-open');
    open.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' }));
    assert(visibleTip(), '点击浮层入口前被当成外部点击关闭');
    open.click(); assert(selected === 1, '浮层入口未打开当前预览的账单'); closed();
  }],
  ['点空白、滚动或取消手势后，同一柱子重新从提示开始', () => {
    for (const dismiss of [() => outside.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' })),
      chart => chart.querySelector('.viz-plot').dispatchEvent(new Event('scroll')),
      chart => chart.querySelector('.viz-hit').dispatchEvent(new PointerEvent('pointercancel', { bubbles: true, pointerType: 'touch' }))]) {
      let selected = null;
      const chart = mount('bar', { onSelect: i => { selected = i; } });
      tap(chart); dismiss(chart); closed(); tap(chart);
      assert(selected === null && visibleTip(), '关闭后首次点按仍直接打开账单');
    }
  }],
  ['手机收到 MouseEvent、零 detail、鼠标类型或无类型点击仍先预览', () => withHoverMouse(false, () => {
    for (const event of [new MouseEvent('click', { bubbles: true, detail: 1 }),
      new MouseEvent('click', { bubbles: true, detail: 0 }),
      new PointerEvent('click', { bubbles: true, pointerType: 'mouse', detail: 1 }),
      new Event('click', { bubbles: true })]) {
      let selected = null;
      const chart = mount('bar', { onSelect: i => { selected = i; fixture.replaceChildren(); } });
      const hit = chart.querySelector('.viz-hit');
      hit.dispatchEvent(new PointerEvent('pointerdown', { pointerType: 'mouse', bubbles: true }));
      hit.dispatchEvent(event);
      assert(selected === null && visibleTip(), '点击类型判断导致直接跳转');
      hit.dispatchEvent(new PointerEvent('pointerdown', { pointerType: 'mouse', bubbles: true }));
      hit.dispatchEvent(event); assert(selected === null, '再次点击柱子直接打开账单');
      visibleTip().querySelector('.viz-open').click(); assert(selected === 0, '浮层入口未打开对应账单'); closed();
    }
  })],
  ['单次触摸后的重复兼容点击不会打开账单', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; } });
    tap(chart, 0, true);
    chart.querySelector('.viz-hit').dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 }));
    assert(selected === null && visibleTip(), '兼容点击重复触发了跳转');
    tap(chart, 0, true); assert(selected === null, '再次点按柱子仍会跳转');
    visibleTip().querySelector('.viz-open').click(); assert(selected === 0, '浮层入口未打开账单');
  }],
  ['触摸开始事件可单独识别兼容点击，无需 pointerType', () => withHoverMouse(true, () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; fixture.replaceChildren(); } });
    const hit = chart.querySelector('.viz-hit');
    hit.dispatchEvent(new Event('touchstart', { bubbles: true })); hit.focus();
    hit.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 }));
    assert(selected === null && visibleTip(), '兼容触摸首点直接跳转');
    hit.dispatchEvent(new Event('touchstart', { bubbles: true }));
    hit.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 }));
    assert(selected === null, '兼容触摸再次点按直接跳转');
    visibleTip().querySelector('.viz-open').click(); assert(selected === 0, '浮层入口未打开账单'); closed();
  })],
  ['首次点按前的指针移动与聚焦不会提前确认预览', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; fixture.replaceChildren(); } });
    showTouch(chart).focus(); tap(chart);
    assert(selected === null && visibleTip(), '自动聚焦被误算为第一次点按');
    tap(chart); assert(selected === null, '再次点按柱子直接跳转');
    visibleTip().querySelector('.viz-open').click(); assert(selected === 0, '浮层入口未打开账单'); closed();
  }],
  ['同次手势的 pointerdown、touchstart 和重复 click 始终只预览', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; fixture.replaceChildren(); } });
    const hit = chart.querySelector('.viz-hit');
    for (let gesture = 0; gesture < 2; gesture++) {
      hit.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' }));
      hit.dispatchEvent(new Event('touchstart', { bubbles: true }));
      hit.dispatchEvent(new PointerEvent('click', { bubbles: true, pointerType: 'touch' }));
      hit.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 }));
      assert(selected === null && visibleTip(), '重复事件导致自动跳转');
    }
    visibleTip().querySelector('.viz-open').click(); assert(selected === 0, '浮层入口未打开账单'); closed();
  }],
  ['兼容点击换了命中柱子，也只会更新预览而不会打开账单', () => withHoverMouse(true, () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; } }); tap(chart);
    chart.querySelectorAll('.viz-hit')[1].dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 }));
    assert(selected === null && visibleTip()?.textContent.includes('2026/02'), '兼容点击意外打开账单');
  })],
  ['第二次点按中取消手势，不打开账单或重新弹出提示', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; } }); tap(chart);
    const hit = chart.querySelector('.viz-hit');
    hit.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' }));
    hit.dispatchEvent(new PointerEvent('pointercancel', { bubbles: true, pointerType: 'touch' }));
    hit.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 }));
    assert(selected === null, '取消手势后仍打开账单'); closed();
  }],
  ['没有详情链接的柱子也能在手指离开后保留提示', () => {
    const chart = mount(); tap(chart);
    assert(visibleTip()?.textContent.includes('$120.00'), '触屏提示过早消失');
    assert(!visibleTip().querySelector('.viz-open'), '没有详情的图表不应显示入口');
  }],
  ['切换页面时不依赖 blur 或 pointerleave', () => {
    const chart = mount(), hit = showTouch(chart); hit.blur(); let left = false;
    hit.addEventListener('blur', () => { left = true; });
    hit.addEventListener('pointerleave', () => { left = true; });
    fixture.replaceChildren(document.createTextNode('住户页面（测试）'));
    assert(!left, '未复现触摸后无离开事件的条件'); closed();
  }],
  ['切页后晚到的旧点击不会重新打开账单', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; } }); tap(chart);
    const hit = chart.querySelector('.viz-hit');
    hit.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' }));
    fixture.replaceChildren();
    hit.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 0 }));
    assert(selected === null, '旧点击把用户带回了账单'); closed();
  }],
  ['点击图表外关闭，随后仍可查看其他柱子', () => {
    const chart = mount(); showTouch(chart);
    outside.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' })); closed();
    showTouch(chart);
    assert(visibleTip().textContent.includes('$120.00'), '提示内容丢失');
  }],
  ['滚动图表时关闭（scroll 不冒泡）', () => {
    const chart = mount(); showTouch(chart);
    chart.querySelector('.viz-plot').dispatchEvent(new Event('scroll', { bubbles: false })); closed();
  }],
  ['取消触摸手势时关闭', () => {
    const chart = mount(), hit = showTouch(chart);
    hit.dispatchEvent(new PointerEvent('pointercancel', { bubbles: true, pointerType: 'touch' })); closed();
  }],
  ['Escape 关闭提示', () => {
    const chart = mount(); showTouch(chart);
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); closed();
  }],
  ['Tab 离开图表时关闭预览', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; } }); tap(chart);
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Tab', bubbles: true })); closed();
    tap(chart); assert(selected === null && visibleTip(), 'Tab 关闭后意外打开账单');
  }],
  ['图表切换表格时关闭', () => {
    const chart = mount(); showTouch(chart);
    [...chart.querySelectorAll('button')].find(button => button.textContent === '表格').click();
    assert(!chart.querySelector('.viz-table').hidden, '未切换到表格'); closed();
  }],
  ['重新绘制同一图表时关闭', () => {
    const chart = mount(); showTouch(chart); columnChart(chart, options); closed();
  }],
  ['图表尺寸变化重画时关闭', async () => {
    const chart = mount(); chart.style.width = '300px';
    await nextFrame(); await nextFrame(); showTouch(chart);
    chart.style.width = '280px'; await nextFrame(); await nextFrame(); closed();
  }],
  ['折线图移除时同样清理提示', () => {
    const chart = mount('line'); showTouch(chart); fixture.replaceChildren(); closed();
  }],
  ['键盘聚焦及方向键仍可查看不同账单', () => {
    const chart = mount(), hits = chart.querySelectorAll('.viz-hit');
    hits[0].focus(); assert(visibleTip()?.textContent.includes('2026/01'), '首张账单提示缺失');
    hits[0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    assert(document.activeElement === hits[1], '方向键未切换账单');
    assert(visibleTip()?.textContent.includes('2026/02'), '下一张账单提示缺失');
  }],
  ['桌面鼠标与键盘先预览，再从浮层入口打开账单', () => withHoverMouse(true, () => {
    for (const event of [new MouseEvent('click', { bubbles: true }), new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })]) {
      const chart = mount(); let selected = null;
      columnChart(chart, { ...options, onSelect: i => { selected = i; fixture.replaceChildren(document.createTextNode('账单详情（测试）')); } });
      showTouch(chart); chart.querySelectorAll('.viz-hit')[1].dispatchEvent(event);
      assert(selected === null, '柱子仍直接打开账单');
      const open = visibleTip().querySelector('.viz-open');
      if (event.type === 'keydown') assert(document.activeElement === open, '键盘未聚焦浮层入口');
      open.click(); assert(selected === 1, '浮层未打开对应账单'); closed();
    }
  })],
  ['浮层固定在绘图区上缘，不跟随柱子或指针移动', () => {
    const chart = mount('bar', { onSelect: () => {} }); tap(chart);
    const tip = visibleTip(), first = tip.getBoundingClientRect(), plot = chart.querySelector('.viz-plot').getBoundingClientRect();
    assert(first.top <= plot.top + 8, '浮层未放在绘图区上方');
    tap(chart, 1);
    const second = visibleTip().getBoundingClientRect();
    assert(Math.abs(first.left - second.left) < 1 && Math.abs(first.top - second.top) < 1, '切换柱子时浮层仍跟随点击位置');
    chart.querySelector('.viz-hit').dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerType: 'mouse', clientX: 20, clientY: 600 }));
    assert(visibleTip().textContent.includes('2026/02'), '移动指针意外切换了账单预览');
    chart.querySelectorAll('.viz-hit')[1].dispatchEvent(new PointerEvent('pointerleave', { pointerType: 'mouse' }));
    assert(visibleTip(), '鼠标还未移到入口，浮层就关闭了');
    assert(first.left >= 0 && first.right <= innerWidth && first.top >= 0 && first.bottom <= innerHeight, '浮层超出屏幕');
  }],
  ['滚动浮层本身不关闭，滚动图表仍关闭', () => {
    const chart = mount('bar', { onSelect: () => {} }); tap(chart);
    visibleTip().dispatchEvent(new Event('scroll'));
    assert(visibleTip(), '查看浮层内容时被关闭');
    chart.querySelector('.viz-plot').dispatchEvent(new Event('scroll')); closed();
  }],
  ['被切换或删除的旧浮层入口不能再打开旧账单', () => {
    let selected = null;
    const chart = mount('bar', { onSelect: i => { selected = i; } }); tap(chart);
    const old = visibleTip().querySelector('.viz-open'); tap(chart, 1); old.click();
    assert(selected === null, '旧入口仍能打开旧账单');
    const current = visibleTip().querySelector('.viz-open'); fixture.replaceChildren(); current.click();
    assert(selected === null, '离开页面后仍能打开账单'); closed();
  }],
];
document.getElementById('run').onclick = async () => {
  const button = document.getElementById('run'); button.disabled = true;
  results.hidden = false; results.replaceChildren(); let passed = 0;
  for (const [name, check] of cases) {
    const item = document.createElement('li');
    try { await check(); passed++; item.textContent = '通过：' + name; }
    catch (error) { item.textContent = '失败：' + name + ' — ' + error.message; }
    finally {
      // 测试之间主动触发旧版也支持的清理事件，避免失败互相影响。
      for (const hit of fixture.querySelectorAll('.viz-hit')) hit.dispatchEvent(new Event('blur'));
      const tip = document.querySelector('.viz-tip'); if (tip) tip.hidden = true;
      fixture.replaceChildren();
      await nextFrame(); await nextFrame();
    }
    results.appendChild(item);
  }
  result.textContent = passed + ' / ' + cases.length + ' 项通过';
  result.dataset.passed = String(passed); result.dataset.total = String(cases.length);
  button.disabled = false;
};
